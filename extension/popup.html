<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momentum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
      text-align: center;
    }

    .login-section {
      display: none;
    }

    .login-section.active {
      display: block;
    }

    .user-section {
      display: none;
    }

    .user-section.active {
      display: block;
    }

    .user-info {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: center;
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .user-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .user-github {
      font-size: 12px;
      color: #666;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-login {
      background: #2ecc71;
      color: white;
      margin-bottom: 10px;
    }

    .btn-login:hover {
      background: #27ae60;
    }

    .btn-logout {
      background: #e74c3c;
      color: white;
    }

    .btn-logout:hover {
      background: #c0392b;
    }

    .status {
      text-align: center;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 12px;
    }

    .status.loading {
      background: #e8f4f8;
      color: #2980b9;
    }

    .status.error {
      background: #fadbd8;
      color: #c0392b;
    }

    .status.success {
      background: #d5f4e6;
      color: #27ae60;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Momentum</h1>

    <div class="login-section active">
      <button class="btn-login" id="loginBtn">Login with GitHub</button>
      <div style="text-align: center; font-size: 13px; color: #666; margin-top: 15px;">
        Or login on <a href="http://localhost:5173" target="_blank" style="color: #2980b9; text-decoration: none; font-weight: 600;">momentum-sync.com</a> to connect automatically.
      </div>
      <div class="status loading" id="status" style="display: none;"></div>
    </div>

    <div class="user-section">
      <div class="user-info">
        <img class="user-avatar" id="userAvatar" alt="User Avatar">
        <div class="user-name" id="userName"></div>
        <div class="user-github" id="userGithubId"></div>
      </div>
      <div id="syncStatusIndicator" class="status" style="margin-bottom: 15px; font-weight: bold;"></div>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </div>

  <script src="popup/popup.js"></script>
</body>
</html>

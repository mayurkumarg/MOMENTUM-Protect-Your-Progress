<!DOCTYPE html>
<html>
<head>
  <title>Momentum - OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #333;
      margin: 0 0 10px 0;
    }
    p {
      color: #666;
      margin: 5px 0;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      color: #d32f2f;
      padding: 15px;
      background: #ffebee;
      border-radius: 5px;
      margin: 15px 0;
      display: none;
    }
    .success {
      color: #388e3c;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 5px;
      margin: 15px 0;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Momentum</h1>
    <p>Completing login...</p>
    <div class="spinner"></div>
    <div class="error" id="error"></div>
    <div class="success" id="success">Login successful! You can close this window.</div>
  </div>

  <script>
    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const accessToken = params.get('accessToken');
    const refreshToken = params.get('refreshToken');
    const error = params.get('error');

    if (error) {
      document.getElementById('error').textContent = error;
      document.getElementById('error').style.display = 'block';
      document.querySelector('p').style.display = 'none';
      document.querySelector('.spinner').style.display = 'none';
    } else if (accessToken && refreshToken) {
      // Decode JWT to get user info
      function decodeBase64Url(value) {
        const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64.padEnd(base64.length + ((4 - (base64.length % 4)) % 4), '=');
        return atob(padded);
      }

      function decodeJWT(token) {
        try {
          const parts = token.split('.');
          if (parts.length !== 3) throw new Error('Invalid token format');
          const payload = JSON.parse(decodeBase64Url(parts[1]));
          return {
            userId: payload.userId,
            githubId: payload.githubId,
          };
        } catch (e) {
          console.error('Error decoding JWT:', e);
          return null;
        }
      }

      const user = decodeJWT(accessToken);

      // Store tokens in extension storage
      chrome.storage.local.set(
        { accessToken, refreshToken, user },
        () => {
          document.getElementById('success').style.display = 'block';
          document.querySelector('p').style.display = 'none';
          document.querySelector('.spinner').style.display = 'none';

          // Notify background script
          chrome.runtime.sendMessage({
            action: 'LOGIN_SUCCESS',
            user,
          }).catch(() => {
            console.log('Background script notified');
          });

          // Close window after 2 seconds
          setTimeout(() => {
            window.close();
          }, 2000);
        }
      );
    } else {
      document.getElementById('error').textContent = 'Invalid response from server';
      document.getElementById('error').style.display = 'block';
      document.querySelector('p').style.display = 'none';
      document.querySelector('.spinner').style.display = 'none';
    }
  </script>
</body>
</html>
